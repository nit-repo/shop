<!DOCTYPE html>
<html lang="en">

<head>
    <script src="assets/js/analytics.js"></script>
    <title>Fashion Z - Product Detail Page</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" href="assets/img/apple-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">
    <!-- Slick -->
    <link rel="stylesheet" type="text/css" href="assets/css/slick.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/slick-theme.css">
</head>

<body>
    <!-- Top nav removed -->


    <div id="header-placeholder"></div>
    <!-- End Cart Modal -->

    <!-- Open Content -->
    <section class="bg-light">
        <div class="container pb-5">
            <div class="row">
                <div class="col-lg-5 mt-5">
                    <div class="card mb-3">
                        <img class="card-img img-fluid" src="" alt="Product Image" id="product-detail" loading="lazy">
                    </div>
                </div>
                <!-- col end -->
                <div class="col-lg-7 mt-5">
                    <div class="card">
                        <div class="card-body">
                            <h1 class="h2" id="product-title">Loading...</h1>
                            <p class="h3 py-2" id="product-price"></p>
                            <p class="py-2" id="product-rating-container">
                                <!-- Stars injected here -->
                            </p>
                            <ul class="list-inline">
                                <li class="list-inline-item">
                                    <h6>Brand:</h6>
                                </li>
                                <li class="list-inline-item">
                                    <p class="text-muted"><strong>Easy Wear</strong></p>
                                </li>
                            </ul>

                            <h6>Description:</h6>
                            <p id="product-description"></p>
                            <ul class="list-inline">
                                <li class="list-inline-item">
                                    <h6>Avaliable Color :</h6>
                                </li>
                                <li class="list-inline-item">
                                    <p class="text-muted"><strong id="product-colors-text"></strong></p>
                                </li>
                            </ul>

                            <ul class="list-inline">
                                <li class="list-inline-item">
                                    <h6>Category :</h6>
                                </li>
                                <li class="list-inline-item">
                                    <p class="text-muted"><strong id="product-category-text"></strong></p>
                                </li>
                            </ul>

                            <div class="row">
                                <div class="col-auto">
                                    <ul class="list-inline pb-3" id="product-size-container">
                                        <li class="list-inline-item">Size :</li>
                                        <!-- Size buttons injected here -->
                                    </ul>
                                </div>
                                <div class="col-auto">
                                    <ul class="list-inline pb-3">
                                        <li class="list-inline-item text-right">
                                            Quantity
                                        </li>
                                        <li class="list-inline-item"><span class="btn btn-success"
                                                id="btn-minus">-</span></li>
                                        <li class="list-inline-item"><span class="badge bg-secondary"
                                                id="var-value">1</span></li>
                                        <li class="list-inline-item"><span class="btn btn-success"
                                                id="btn-plus">+</span></li>
                                    </ul>
                                </div>
                            </div>
                            <div class="row pb-3">
                                <div class="col d-grid">
                                    <button type="button" class="btn btn-success btn-lg" id="btn-buy-now">Buy</button>
                                </div>
                                <div class="col d-grid">
                                    <button type="button" class="btn btn-success btn-lg btn-add-cart"
                                        id="btn-add-cart-detail">Add To Cart</button>
                                    <button type="button" class="btn btn-danger btn-lg btn-remove-cart"
                                        id="btn-remove-cart-detail" style="display:none;">Remove from Cart</button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Close Content -->

    <!-- Start Article -->
    <section class="py-5">
        <div class="container">
            <div class="row text-left p-2 pb-3">
                <h4>Related Products</h4>
            </div>

            <!-- Carousel Wrapper -->
            <div id="carousel-related-product" class="related-products-container">
                <div class="p-2 pb-3 text-center">Loading related products...</div>
            </div>
        </div>
    </section>
    <!-- End Article -->
    <div id="footer-placeholder"></div>

    <!-- Start Script -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="https://code.jquery.com/jquery-migrate-3.3.2.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/slick.min.js"></script>
    <script src="assets/js/templatemo.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/render-products.js"></script>
    <!-- End Script -->
</body>

</html>
