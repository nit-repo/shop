<!DOCTYPE html>
<html lang="en">

<head>
    <script src="assets/js/analytics.js"></script>
    <title>Fashion Z - Product Listing Page</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" href="assets/img/apple-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">
</head>

<body>
    <!-- Top nav removed -->


    <div id="header-placeholder"></div>


    <!-- Start Content -->
    <div class="container py-5">
        <div class="row">

            <div class="col-lg-3">
                <h1 class="h2 pb-4">Categories</h1>
                <ul class="list-unstyled fw-bold">
                    <li class="pb-2"><a class="filter-link text-decoration-none text-dark" href="#" data-type="category"
                            data-value="Fits">Clothing / Fits</a></li>
                    <li class="pb-2"><a class="filter-link text-decoration-none text-dark" href="#" data-type="category"
                            data-value="Accessories">Accessories</a></li>
                </ul>
            </div>

            <div class="col-lg-9">
                <div class="row">
                    <div class="col-md-6">
                        <ul class="list-inline shop-top-menu pb-3 pt-1">
                            <li class="list-inline-item">
                                <a class="filter-link h3 text-dark text-decoration-none mr-3" href="#" data-type="all"
                                    data-value="all">All</a>
                            </li>
                        </ul>
                    </div>
                    <div class="col-md-6 pb-4">
                        <div class="d-flex">
                            <select id="sort-select" class="form-control">
                                <option value="featured">Featured</option>
                                <option value="name-asc">A to Z</option>
                                <option value="name-desc">Z to A</option>
                                <option value="price-asc">Price: Low to High</option>
                                <option value="price-desc">Price: High to Low</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="row" id="product-grid">
                    <div class="col-12 text-center">Loading products…</div>
                    <noscript>
                        <div class="col-12 text-center">Enable JavaScript to view products.</div>
                    </noscript>
                </div>

                <div class="row">
                    <ul class="pagination pagination-lg justify-content-end" id="pagination-container">
                    </ul>
                </div>
            </div>

        </div>
    </div>
    <!-- End Content -->

    <!-- Start Brands -->
    <div id="brands-placeholder"></div>
    <!--End Brands-->


    <div id="footer-placeholder"></div>

    <!-- Start Script -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="https://code.jquery.com/jquery-migrate-3.3.2.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/templatemo.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/render-products.js"></script>
    <!-- End Script -->
</body>

</html>
